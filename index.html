<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Mundo dos Slimes</title>
<meta name="description" content="Um mundo vivo de slimes que aprendem, trabalham e constroem sozinhos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: terno, curioso, de livro ilustrado infantil, mas um jogo de verdade.
   IDEA: um terrário vivo visto de cima, com um caderno de campo ao lado.
   PICTURE: o mapa da floresta em canvas, com cachoeira, riachos e slimes saltitando.
   COLOUR and TYPE: verde-floresta domina, azul-slime é o acento, madeira como apoio; Baloo 2.
   LAYOUT: mapa grande à esquerda, caderno com abas à direita; empilha abaixo de 900px. */
:root{color-scheme:light dark;
--bg:light-dark(#eef4e6,#0e1912);--panel:light-dark(#fbfdf7,#14231a);--ink:light-dark(#18281d,#e4eee3);
--muted:light-dark(#5b6d5f,#9fb3a3);--line:light-dark(#d6e2cf,#24382b);--forest:#1f3d2a;--slime:#2f8cf0;--slime2:light-dark(#dcebff,#173252);
--wood:#a5683a;--ok:#2f9b57;--warn:#c4552f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Baloo 2",system-ui,sans-serif;overflow-x:clip;display:flex;flex-direction:column}
header{background:var(--forest);color:#eaf6e4;display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;padding:8px max(2vw,14px)}
header h1{font-size:26px;line-height:1.05;margin:0;font-weight:800;letter-spacing:.2px}
header h1 span{color:#8fd0ff}
.stats{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:#cfe5c8}
.stats b{color:#fff;font-weight:700}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
.stage{position:relative;min-height:420px;background:#2c4a30;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#cv.drag{cursor:grabbing}
.hud{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.hud button,.btn{font:inherit;font-weight:700;border:0;border-radius:12px;min-height:44px;padding:0 14px;cursor:pointer}
.hud button{width:44px;background:rgba(15,30,20,.75);color:#fff;font-size:20px}
.hud button:focus-visible,.btn:focus-visible,.tab:focus-visible,input:focus-visible,.chip:focus-visible{outline:3px solid var(--slime);outline-offset:2px}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(15,30,20,.88);color:#fff;padding:8px 16px;border-radius:14px;font-weight:600;max-width:90%;text-align:center;opacity:0;transition:opacity .4s;pointer-events:none}
#toast.on{opacity:1}
#tip{position:absolute;pointer-events:none;background:rgba(15,30,20,.9);color:#fff;font-size:13px;padding:4px 10px;border-radius:10px;display:none;white-space:nowrap}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#1f3d2a;color:#eaf6e4;font-size:22px;font-weight:700;z-index:5}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;font:inherit;font-weight:700;font-size:15px;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);min-height:46px;cursor:pointer}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--slime)}
.pane{display:none;flex:1;overflow:auto;padding:14px 16px;min-height:0}
.pane.on{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex:none}
.chip{flex:none;font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:2px 12px 2px 6px;min-height:36px;display:flex;align-items:center;gap:6px;cursor:pointer}
.chip i{width:18px;height:14px;border-radius:9px 9px 5px 5px;display:block}
.chip[aria-pressed=true]{background:var(--slime2);border-color:var(--slime)}
.who{display:flex;gap:12px;align-items:center}
.who canvas{width:56px;height:56px;flex:none}
.who h2{margin:0;font-size:24px;line-height:1.05}
.who p{margin:0;color:var(--muted);font-size:14px}
#chat{flex:1;min-height:180px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px}
.msg{max-width:86%;padding:7px 12px;border-radius:16px;font-size:15.5px;line-height:1.4}
.msg.u{align-self:flex-end;background:var(--slime);color:#fff;border-bottom-right-radius:5px}
.msg.s{align-self:flex-start;background:var(--slime2);border-bottom-left-radius:5px}
.msg.sys{align-self:center;background:none;color:var(--muted);font-size:13.5px;text-align:center;max-width:100%}
.msg small{display:block;opacity:.75;font-size:12.5px;margin-top:2px}
form{display:flex;gap:8px;flex:none}
input[type=text]{font:inherit;font-size:16px;flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:light-dark(#fff,#0f1c14);color:var(--ink);padding:0 12px}
.btn{background:var(--slime);color:#fff}
.btn.alt{background:var(--wood)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:none}
.mind{font-size:13px;color:var(--muted)}
.mind b{color:var(--ink)}
h3{margin:4px 0 0;font-size:18px;line-height:1.1}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:9.5em minmax(0,1fr) 3em;gap:8px;align-items:center;font-size:14px}
.bar .t{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar .t span{display:block;height:100%;border-radius:6px}
.bar em{font-style:normal;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.facts{margin:0;padding-left:18px;font-size:14.5px}
.facts li{margin:2px 0}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.res div{background:var(--bg);border-radius:10px;padding:4px 10px;font-size:13.5px;color:var(--muted)}
.res b{display:block;color:var(--ink);font-size:17px;font-variant-numeric:tabular-nums}
.blist{display:grid;gap:8px}
.bitem{border:1px solid var(--line);border-radius:14px;padding:8px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.bitem strong{font-size:16px}
.bitem p{margin:0;font-size:13.5px;color:var(--muted);grid-column:1}
.bitem .btn{grid-row:1/span 3;grid-column:2;min-height:40px;font-size:14px}
.no{color:var(--warn)}.yes{color:var(--ok)}
.log{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14.5px}
.log li{border-left:3px solid var(--slime);padding:2px 0 2px 10px}
.log time{display:block;font-size:12.5px;color:var(--muted)}
.prog{height:12px;border-radius:7px;background:var(--line);overflow:hidden}
.prog span{display:block;height:100%;background:linear-gradient(90deg,#5fb6ff,#2f8cf0)}
.note{font-size:13px;color:var(--muted)}
.autow{display:flex;gap:8px;align-items:center;cursor:pointer;flex:none}.autow input{width:20px;height:20px;accent-color:var(--slime);flex:none}
@media(max-width:900px){
 html,body{height:100vh;height:100dvh;overflow:hidden}
 header{padding:6px 12px;gap:2px 12px}header h1{font-size:20px}.stats{font-size:12.5px;gap:2px 10px}.live{display:none}
 main{grid-template-columns:1fr;grid-template-rows:minmax(0,36%) minmax(0,1fr);transition:grid-template-rows .25s}
 body.mapbig main{grid-template-rows:minmax(0,72%) minmax(0,1fr)}
 body.typing main{grid-template-rows:minmax(0,18%) minmax(0,1fr)}
 .stage{min-height:0}
 aside{border-left:0;border-top:1px solid var(--line);min-height:0;overflow:hidden}
 .tab{min-height:42px;font-size:14.5px}
 .pane{padding:8px 12px calc(8px + env(safe-area-inset-bottom));gap:8px}
 #p-chat.on{gap:8px;overflow:hidden}
 .who canvas{width:40px;height:40px}.who h2{font-size:19px}.who p{font-size:12.5px}
 #chat{flex:1;min-height:60px;max-height:none;overscroll-behavior:contain}
 .msg{font-size:15px}
 #how{display:none}
 .hud button{width:42px;min-height:42px}
 .hud #mapsize{display:block}
 .stats .opt{display:none}
}
#mapsize{display:none}
.composer{display:flex;flex-direction:column;gap:8px;flex:none}
.composer .row input#nick{max-width:none}
@media(max-width:900px){.composer .row:first-child{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
.live{font-size:13px;color:#cfe5c8}
.msg.pend{opacity:.75}
.msg .a{display:block;font-size:12px;opacity:.8;font-weight:700}
a{color:var(--slime)}
.blist .bitem{grid-template-columns:1fr}
</style>
</head>
<body>
<header>
  <h1>Mundo dos <span>Slimes</span></h1>
  <div class="stats" id="stats"></div>
  <div class="live" id="live"></div>
</header>
<main>
  <section class="stage" aria-label="Mapa da floresta">
    <canvas id="cv"></canvas>
    <div id="tip"></div>
    <div id="toast" role="status"></div>
    <div class="hud">
      <button id="zin" aria-label="Aproximar">+</button>
      <button id="zout" aria-label="Afastar">−</button>
      <button id="zhome" aria-label="Voltar ao slime selecionado">◎</button>
      <button id="mapsize" aria-label="Aumentar ou diminuir o mapa">⤢</button>
    </div>
    <div id="loading">Acordando a floresta…</div>
  </section>
  <aside>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-chat" aria-selected="true">Conversar</button>
      <button class="tab" role="tab" id="t-slime" aria-selected="false">Slime</button>
      <button class="tab" role="tab" id="t-build" aria-selected="false">Vila</button>
      <button class="tab" role="tab" id="t-log" aria-selected="false">Diário</button>
    </div>
    <div class="pane on" id="p-chat">
      <div class="chips" id="chips"></div>
      <div class="who"><canvas id="face" width="112" height="112"></canvas><div><h2 id="wname"></h2><p id="wprof"></p></div></div>
      <div id="chat" aria-live="polite"></div>
      <div class="composer">
      <div class="row"><input type="text" id="nick" placeholder="Seu nome" maxlength="24" aria-label="Seu nome" style="max-width:12em"><button class="btn ghost" id="moreopt" type="button" aria-expanded="false" style="display:none">Pesquisa</button></div>
      <form id="f"><input type="text" id="msg" placeholder="Pergunte ou ensine algo ao slime…" autocomplete="off" maxlength="400"><button class="btn" id="send">Enviar</button></form>
      <div class="row"><input type="text" id="topic" placeholder="Tema para ele pesquisar" maxlength="80"><button class="btn alt" id="research" type="button">Pedir pesquisa</button></div>
      </div>
      <p class="mind" id="how">Este mundo é um só para todo mundo e continua vivo mesmo com a página fechada.</p>
    </div>
    <div class="pane" id="p-slime"></div>
    <div class="pane" id="p-build"></div>
    <div class="pane" id="p-log"><h3>Diário do mundo</h3><ul class="log" id="log"></ul></div>
  </aside>
</main>
<script src="shared.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const Mu=window.Mundo,{DOMS,DK,RES,B,TASK,BUGS,PRED,total,level,profOf,profName,h2,fbm,fmt}=Mu;
const TS=32,MARG=10;
// Repositório: detectado pelo endereço do GitHub Pages (usuario.github.io/repositorio).
const OWNER=location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]:'';
const REPO=OWNER?(location.pathname.split('/').filter(Boolean)[0]||OWNER+'.github.io'):'';
let S=null,E=null,selId=1,lastKey='',pollT=0,fast=0;
const T=(x,y)=>E.T(x,y),isWet=t=>t.t==='W'||t.t==='F',inB=(x,y)=>E.inB(x,y),home=s=>E.home(s),has=t=>S.buildings.some(b=>b.type===t);
const V={};
async function fetchWorld(){
 if(OWNER){
  try{const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/world.json?ref=dados`,{headers:{Accept:'application/vnd.github.raw+json'},cache:'no-store'});if(r.ok)return await r.json()}catch(e){}
  const r=await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/dados/world.json?t=${Date.now()}`,{cache:'no-store'});if(r.ok)return await r.json();
  throw new Error('sem dados');
 }
 const r=await fetch('world.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('sem dados');return await r.json();
}
async function load(){
 try{
  const st=await fetchWorld();
  if(S&&st.last===S.last)return;
  const first=!S;S=st;E=Mu.Engine(S);
  const key=JSON.stringify(S.bounds)+':'+S.planted.length;if(key!==lastKey){lastKey=key;groundDirty=true}
  const now=performance.now();
  for(const s of S.slimes){const v=V[s.id];if(!v)V[s.id]={x:s.x,y:s.y,tx:s.x,ty:s.y,ph:Math.random()*6};else{v.tx=s.x;v.ty=s.y}if(s.say&&!first){const st=now+Math.random()*30000;V[s.id].say={t:s.say,from:st,until:st+3500}}}
  if(!S.slimes.some(s=>s.id===selId))selId=S.slimes[0].id;
  if(first){const s=sel();cam.x=s.x+.5;cam.y=s.y-3;const l=$('#loading');if(l)l.remove()}
  renderAll();
 }catch(e){const l=$('#loading');if(l)l.textContent='O mundo ainda não acordou. Tente de novo em alguns minutos.'}
}
function schedule(){clearTimeout(pollT);pollT=setTimeout(async()=>{await load();schedule()},fast>Date.now()?20000:90000)}
const sel=()=>S.slimes.find(s=>s.id===selId)||S.slimes[0];

/* ---------- desenho ---------- */
const cv=$('#cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
const cam={x:0,y:0,z:1.4};
let ground=null,gx0=0,gy0=0,groundDirty=true,fruitTrees=0,treeCount=0,trees=[],waters=[];
function rebuildGround(){
 groundDirty=false;
 const b=S.bounds;gx0=b.x0-MARG;gy0=b.y0-MARG;const gw=b.x1-b.x0+MARG*2,gh=b.y1-b.y0+MARG*2;
 const gk=Math.min(1,3000/(Math.max(gw,gh)*TS));ground=document.createElement('canvas');ground.width=Math.ceil(gw*TS*gk);ground.height=Math.ceil(gh*TS*gk);ground.gw=gw*TS;ground.gh=gh*TS;
 const g=ground.getContext('2d');g.scale(gk,gk);trees=[];waters=[];fruitTrees=0;treeCount=0;
 for(let j=0;j<gh;j++)for(let i=0;i<gw;i++){
  const x=gx0+i,y=gy0+j,t=T(x,y),px=i*TS,py=j*TS,hv=h2(x,y,S.seed+21);
  if(t.t==='C'){const gr=g.createLinearGradient(0,py,0,py+TS);gr.addColorStop(0,'#8a8f87');gr.addColorStop(1,y===-9?'#5d625c':'#767b73');g.fillStyle=gr;g.fillRect(px,py,TS,TS);g.fillStyle='rgba(255,255,255,.12)';g.fillRect(px+hv*20,py+4,8,3);g.fillStyle='rgba(0,0,0,.15)';g.fillRect(px+4+hv*14,py+18,10,3);continue}
  if(isWet(t)){g.fillStyle=t.t==='F'?'#7fc4ef':t.pond?'#2f7fc4':'#3a8fd0';g.fillRect(px,py,TS,TS);waters.push({x,y,f:t.t==='F',p:t.pond});continue}
  const shade=t.t==='T'?-6:0,l=y<-10?34:40,sn=fbm(x*.22,y*.22,S.seed+77);
  g.fillStyle=`hsl(${96+sn*14} ${38+sn*10}% ${l+shade+sn*7+hv*1.5}%)`;g.fillRect(px,py,TS,TS);
  g.fillStyle='rgba(20,60,20,.18)';for(let k=0;k<3;k++){const a=h2(x,y,S.seed+30+k);g.fillRect(px+a*28,py+h2(y,x,S.seed+40+k)*28,2,4)}
  // margens
  for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){if(isWet(T(x+dx,y+dy))){g.fillStyle='rgba(205,190,140,.55)';if(dx===1)g.fillRect(px+TS-4,py,4,TS);if(dx===-1)g.fillRect(px,py,4,TS);if(dy===1)g.fillRect(px,py+TS-4,TS,4);if(dy===-1)g.fillRect(px,py,TS,4)}}
  if(t.fl){const cols=['#fff6a8','#ffffff','#ffb3d1','#c9b6ff'];g.fillStyle=cols[Math.floor(hv*4)];for(let k=0;k<3;k++)g.fillRect(px+6+h2(x,y,k)*20,py+6+h2(y,x,k)*20,3,3)}
  if(t.rk){g.fillStyle='#8d918a';g.beginPath();g.ellipse(px+16,py+20,8,5,0,0,7);g.fill();g.fillStyle='#a9ada5';g.beginPath();g.ellipse(px+14,py+18,4,2,0,0,7);g.fill()}
  if(t.t==='T'){trees.push({x,y,t});if(inB(x,y)){treeCount++;if(t.kind==='fruta')fruitTrees++}}
 }
}
function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR}
new ResizeObserver(resize).observe(cv);
const sx=x=>(x-cam.x)*TS*cam.z+W/2, sy=y=>(y-cam.y)*TS*cam.z+H/2;
function drawTree(o,tm){
 const{x,y,t}=o,z=cam.z*TS,cx=sx(x+.5),by=sy(y+.85),s=t.sz*z;
 ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(cx,by,s*.36,s*.12,0,0,7);ctx.fill();
 ctx.fillStyle='#6b4528';ctx.fillRect(cx-s*.06,by-s*.38,s*.12,s*.38);
 const sway=Math.sin(tm/1400+x*.7+y)*s*.015;
 if(t.kind==='pinho'){
  for(let k=0;k<3;k++){const w=s*(.42-k*.1),yy=by-s*(.25+k*.28);ctx.fillStyle=k===2?'#3f8a4a':k===1?'#2f7440':'#245f35';ctx.beginPath();ctx.moveTo(cx-w+sway,yy);ctx.lineTo(cx+w+sway,yy);ctx.lineTo(cx+sway*2,yy-s*.42);ctx.closePath();ctx.fill()}
 }else{
  const cy=by-s*.62,col=t.kind==='fruta'?['#2e7d3a','#3d9a48','#5bb85a']:['#28703a','#358a45','#4fa752'];
  ctx.fillStyle=col[0];ctx.beginPath();ctx.arc(cx+sway,cy+s*.06,s*.4,0,7);ctx.fill();
  ctx.fillStyle=col[1];ctx.beginPath();ctx.arc(cx-s*.08+sway,cy-s*.04,s*.32,0,7);ctx.fill();
  ctx.fillStyle=col[2];ctx.beginPath();ctx.arc(cx-s*.14+sway,cy-s*.14,s*.15,0,7);ctx.fill();
  if(t.kind==='fruta'){ctx.fillStyle=t.fc;for(let k=0;k<5;k++){const a=h2(x,y,S.seed+50+k)*6.28,r=s*(.12+h2(y,x,S.seed+60+k)*.2);ctx.beginPath();ctx.arc(cx+Math.cos(a)*r+sway,cy+Math.sin(a)*r,Math.max(1.5,s*.055),0,7);ctx.fill()}}
 }
}
function roof(cx,by,w,h,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(cx-w*.62,by);ctx.lineTo(cx,by-h);ctx.lineTo(cx+w*.62,by);ctx.closePath();ctx.fill()}
function drawBuilding(b){drawB(b);if((b.nv||1)>1&&cam.z>.8){const z=cam.z*TS;ctx.fillStyle='#ffd34d';ctx.font=`700 ${Math.max(9,z*.22)}px sans-serif`;ctx.textAlign='center';ctx.fillText('★'.repeat(b.nv-1),sx(b.x+.5),sy(b.y+.9)+Math.max(10,z*.25));ctx.textAlign='left'}}
function drawB(b){
 const z=cam.z*TS,cx=sx(b.x+.5),by=sy(b.y+.9),w=z*.9;
 ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(cx,by,w*.55,w*.15,0,0,7);ctx.fill();
 const box=(col,h)=>{ctx.fillStyle=col;ctx.fillRect(cx-w*.42,by-h,w*.84,h)};
 const door=(h)=>{ctx.fillStyle='#4a2f1c';ctx.fillRect(cx-w*.09,by-h,w*.18,h)};
 const win=(x,y)=>{ctx.fillStyle='#ffe69a';ctx.fillRect(cx+x*w-w*.07,by-y*w,w*.14,w*.12)};

 for(const[x,y,r,f]of lights){if(!f&&r<.9&&r!==.8)continue;const px=sx(x),py=sy(y),R=r*z*.8;const g=ctx.createRadialGradient(px,py,0,px,py,R);g.addColorStop(0,`rgba(255,${f?150:220},${f?60:120},${.28*a})`);g.addColorStop(1,'rgba(255,200,100,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,R,0,7);ctx.fill()}
 ctx.globalCompositeOperation='source-over';
 if(a>.4){ctx.fillStyle='rgba(255,255,255,.7)';for(let i=0;i<30;i++){const x=(h2(i,7,1)*W),y=h2(i,9,2)*H*.35;if(Math.sin(tm/600+i)>.3)ctx.fillRect(x,y,1.5,1.5)}}
}
function bubble(x,y,text){
 ctx.font=`600 ${Math.max(12,Math.min(15,11*cam.z))}px "Baloo 2",sans-serif`;
 const words=text.length>90?text.slice(0,88)+'…':text,lines=[];let cur='';
 for(const w of words.split(/\s+/)){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>190&&cur){lines.push(cur);cur=w}else cur=t}lines.push(cur);
 const lh=17,bw=Math.max(...lines.map(l=>ctx.measureText(l).width))+18,bh=lines.length*lh+10,bx=Math.max(4,Math.min(W-bw-4,x-bw/2)),byy=y-bh-10;
 ctx.fillStyle='rgba(255,255,255,.95)';ctx.beginPath();ctx.roundRect(bx,byy,bw,bh,10);ctx.fill();
 ctx.beginPath();ctx.moveTo(x-6,byy+bh);ctx.lineTo(x,byy+bh+8);ctx.lineTo(x+6,byy+bh);ctx.fill();
 ctx.fillStyle='#1a2233';lines.forEach((l,i)=>ctx.fillText(l,bx+9,byy+18+i*lh));
}
let lastT=performance.now(),sayT=0;
function frame(tm){
 requestAnimationFrame(frame);
 if(!S||!W)return;
 const dt=Math.min(.1,(tm-lastT)/1000);lastT=tm;
 if(groundDirty)rebuildGround();
 for(const s of S.slimes){const v=V[s.id];const dx=v.tx-v.x,dy=v.ty-v.y,d=Math.hypot(dx,dy);
  if(d<.05){v.moving=false;if(!v.wait)v.wait=tm+2000+Math.random()*5000;if(tm>v.wait){v.wait=0;for(let i=0;i<10;i++){const x=s.x+(Math.random()*3-1.5),y=s.y+(Math.random()*2.4-1.2),t=T(Math.round(x),Math.round(y));if(!isWet(t)&&t.t!=='C'){v.tx=x;v.ty=y;break}}}}
  else{const sp=d>4?6:1.2,m=Math.min(d,sp*dt);v.x+=dx/d*m;v.y+=dy/d*m;v.moving=true}}
 if(tm>sayT){sayT=tm+6000;const s=S.slimes[Math.floor(Math.random()*S.slimes.length)];if(s.task)V[s.id].say={t:TASK[s.task].v[0].toUpperCase()+TASK[s.task].v.slice(1)+'…',until:tm+3000}}
 ctx.setTransform(DPR,0,0,DPR,0,0);
 ctx.fillStyle='#24432b';ctx.fillRect(0,0,W,H);ctx.imageSmoothingEnabled=false;
 const z=cam.z*TS;
 ctx.imageSmoothingEnabled=ground.width<ground.gw;ctx.drawImage(ground,sx(gx0),sy(gy0),ground.gw*cam.z,ground.gh*cam.z);ctx.imageSmoothingEnabled=false;
 const vx0=cam.x-W/2/z-1,vx1=cam.x+W/2/z+1,vy0=cam.y-H/2/z-1,vy1=cam.y+H/2/z+2;
 for(const w of waters){if(w.x<vx0||w.x>vx1||w.y<vy0||w.y>vy1)continue;const px=sx(w.x),py=sy(w.y);
  if(w.f){ctx.fillStyle='rgba(255,255,255,.75)';for(let k=0;k<4;k++){const o=((tm/220+k*.25+w.x*.3)%1);ctx.fillRect(px+(k*.24+.06)*z,py+o*z,z*.07,z*.35)}}
  else{ctx.fillStyle='rgba(255,255,255,.22)';const o=Math.sin(tm/700+w.x*1.3+w.y*.9);ctx.fillRect(px+z*(.2+o*.1),py+z*.35,z*.3,Math.max(1,z*.05));ctx.fillRect(px+z*(.5-o*.1),py+z*.7,z*.25,Math.max(1,z*.05))}
  if(w.p&&w.y<=-7){ctx.fillStyle='rgba(255,255,255,.35)';const o=(tm/500+w.x)%1;ctx.beginPath();ctx.arc(px+z*.5,py+z*.4,z*(.15+o*.25),0,7);ctx.fill()}}
 const objs=[];
 for(const t of trees)if(t.x>=vx0&&t.x<=vx1&&t.y>=vy0&&t.y<=vy1)objs.push({y:t.y+.85,f:()=>drawTree(t,tm)});
 for(const b of S.buildings)objs.push({y:b.y+.9,f:()=>drawBuilding(b)});
 for(const b of S.bugs||[])if(b.x>=vx0&&b.x<=vx1&&b.y>=vy0&&b.y<=vy1)objs.push({y:b.y+.6,f:()=>drawBug(b,tm)});
 if(S.pred)objs.push({y:S.pred.y+.7,f:()=>drawPred(S.pred,tm)});
 for(const s of S.slimes){const v=V[s.id];objs.push({y:v.y+.6,f:()=>{const r=z*.34*(.75+Math.min(.45,level(s)*.05));drawSlimeAt(ctx,sx(v.x+.5),sy(v.y+.6),r,s.hue,tm,v.ph,v.moving,s.id===selId);
  if(cam.z>1||s.id===selId){ctx.font=`700 ${Math.max(11,10*cam.z)}px "Baloo 2",sans-serif`;ctx.textAlign='center';ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillText(s.name,sx(v.x+.5)+1,sy(v.y+.6)+r*.55+12);ctx.fillStyle='#fff';ctx.fillText(s.name,sx(v.x+.5),sy(v.y+.6)+r*.55+11);ctx.textAlign='left'}}})}
 objs.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
 drawSky(tm,dt);
 const b=S.bounds;ctx.fillStyle='rgba(10,25,15,.55)';ctx.beginPath();ctx.rect(0,0,W,H);ctx.rect(sx(b.x0+1),sy(b.y0+1),(b.x1-b.x0-1)*z,(b.y1-b.y0-1)*z);ctx.fill('evenodd');
 ctx.strokeStyle='rgba(255,255,255,.18)';ctx.setLineDash([6,6]);ctx.strokeRect(sx(b.x0+1),sy(b.y0+1),(b.x1-b.x0-1)*z,(b.y1-b.y0-1)*z);ctx.setLineDash([]);
 for(const s of S.slimes){const v=V[s.id];if(v.say&&v.say.until>tm&&(v.say.from||0)<=tm){const r=z*.34*(.75+Math.min(.45,level(s)*.05));bubble(sx(v.x+.5),sy(v.y+.6)-r*1.8,v.say.t)}}
 const fs=sel();if(fs){fctx.clearRect(0,0,112,112);drawSlimeAt(fctx,56,96,34,fs.hue,tm,V[fs.id].ph,false,false)}
}
const face=$('#face'),fctx=face.getContext('2d');

/* ---------- mapa ---------- */
let drag=null;
function slimeAt(wx,wy){let best=null,bd=.7;for(const s of S.slimes){const v=V[s.id];const d=Math.hypot(v.x+.5-wx,v.y+.35-wy);if(d<bd){bd=d;best=s}}return best}
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};cv.setPointerCapture(e.pointerId);cv.classList.add('drag')});
cv.addEventListener('pointermove',e=>{
 if(!S)return;const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
 if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;cam.x=drag.cx-dx/(TS*cam.z);cam.y=drag.cy-dy/(TS*cam.z);$('#tip').style.display='none';return}
 const wx=(mx-W/2)/(TS*cam.z)+cam.x,wy=(my-H/2)/(TS*cam.z)+cam.y,tx=Math.floor(wx),ty=Math.floor(wy);
 const tip=$('#tip');let txt='';const s=slimeAt(wx,wy);
 if(s)txt=`${s.name} · nível ${level(s)} · ${profName(s)}${s.task?' · '+TASK[s.task].v:''}`;
 else{const b=S.buildings.find(b=>b.x===tx&&b.y===ty),t=T(tx,ty);
  if(b){const o=S.slimes.find(x=>x.id===b.owner);txt=B[b.type].n+(B[b.type].home&&o?' de '+o.name:'')}
  else if(t.t==='F')txt='Cachoeira';else if(t.t==='W')txt=t.pond?'Lago da cachoeira':'Riacho (protegido)';
  else if(t.t==='T')txt=(t.kind==='fruta'?'Árvore frutífera':t.kind==='pinho'?'Pinheiro':'Árvore')+' (protegida)';else if(t.t==='C')txt='Paredão de pedra'}
 if(txt){tip.textContent=txt;tip.style.display='block';tip.style.left=Math.min(mx+14,W-tip.offsetWidth-6)+'px';tip.style.top=(my+14)+'px'}else tip.style.display='none';
});
cv.addEventListener('pointerleave',()=>$('#tip').style.display='none');
cv.addEventListener('pointerup',e=>{cv.classList.remove('drag');if(S&&drag&&!drag.moved){const r=cv.getBoundingClientRect(),wx=(e.clientX-r.left-W/2)/(TS*cam.z)+cam.x,wy=(e.clientY-r.top-H/2)/(TS*cam.z)+cam.y;const s=slimeAt(wx,wy);if(s)select(s.id)}drag=null});
function zoom(f){cam.z=Math.max(.45,Math.min(3.2,cam.z*f))}

$('#zhome').onclick=()=>{const v=V[sel().id];cam.x=v.x+.5;cam.y=v.y+.5};

/* ---------- painel ---------- */
let toastT=0;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),4000)}
function select(id){selId=id;const v=V[id];cam.x=v.x+.5;cam.y=v.y+.5;renderAll()}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=t=>{const m=Math.round((Date.now()-t)/60000);return m<1?'agora mesmo':m===1?'há 1 minuto':m<60?`há ${m} minutos`:`há ${Math.round(m/60)} h`};
function renderStats(){
 const area=(S.bounds.x1-S.bounds.x0-1)*(S.bounds.y1-S.bounds.y0-1),homes=S.buildings.filter(b=>B[b.type].home).length;
 $('#stats').innerHTML=`<span><b>${S.slimes.length}</b> slimes</span><span class="opt"><b>${homes}</b> moradias</span><span class="opt"><b>${S.buildings.length-homes}</b> construções</span><span>${(()=>{const c=worldClock();return `${c.season.i} <b>${c.season.n}</b> · dia ${c.day} · ${c.night?'🌙':'☀️'} ${String(Math.floor(c.hour)).padStart(2,'0')}h`})()}</span><span class="opt"><b>${E.treeCount}</b> árvores</span><span><b>${(S.bugs||[]).length}</b> insetos</span>${S.pred&&PRED[S.pred.k]?`<span style="color:#ff8a8a">⚠ <b>${PRED[S.pred.k].n}</b> perto da vila</span>`:''}<span class="opt"><b>${S.planted.length}</b> plantadas</span><span class="opt">área <b>${area}</b> lotes</span>`;

function renderChips(){$('#chips').innerHTML=S.slimes.map(s=>`<button class="chip" data-id="${s.id}" aria-pressed="${s.id===selId}"><i style="background:hsl(${s.hue} 75% 58%)"></i>${esc(s.name)} <small>nv ${level(s)}</small></button>`).join('')}
function renderChat(){
 const s=sel();$('#wname').textContent=s.name;$('#wprof').textContent=`Nível ${level(s)} · ${profName(s)} · ${fmt(total(s))} de conhecimento`;
 const pend=FB.pending(s.id);const el=$('#chat');el.innerHTML=s.chat.concat(pend).map(m=>`<div class="msg ${m.r}${m.p?' pend':''}">${m.a?`<span class="a">${esc(m.a)}</span>`:''}${esc(m.t).replace(/\n/g,'<br>')}${m.g?`<small>${esc(m.g)}</small>`:''}</div>`).join('');el.scrollTop=el.scrollHeight;
}
function renderSlime(){
 const s=sel(),t=total(s),max=Math.max(10,...DK.map(d=>s.k[d]||0)),h=home(s);
 $('#p-slime').innerHTML=`<div><h2>${esc(s.name)}</h2><p class="note">Geração ${s.gen} · ${h?esc(B[h.type].n):'sem moradia ainda'}</p></div>
 <div><h3>Nível ${level(s)} · ${esc(profName(s))}</h3><p class="note">${fmt(t)} de ${s.nextSplit} pontos para se dividir em dois.</p><div class="prog"><span style="width:${Math.min(100,t/s.nextSplit*100)}%"></span></div></div>
 <div><h3>Agora: ${s.task?TASK[s.task].v:'descansando'}</h3><p class="note">${s.ok} acertos e ${s.err} erros até agora. Errar também ensina: cada erro dá mais conhecimento que um acerto, e às vezes vira uma lição.${s.focus?' Está focado em '+DOMS[s.focus.d].n.toLowerCase()+' por causa de uma conversa.':''}</p></div>
 <div><h3>Conhecimento</h3><div class="bars">${DK.map(d=>`<div class="bar"><span>${DOMS[d].n}</span><div class="t"><span style="width:${(s.k[d]||0)/max*100}%;background:${DOMS[d].c}"></span></div><em>${fmt(s.k[d]||0)}</em></div>`).join('')}</div></div>
 <div><h3>O que ${esc(s.name)} sabe</h3>${s.facts.length?`<ul class="facts">${s.facts.slice().reverse().map(f=>`<li>${esc(f.f)}${f.src?` <a href="${esc(f.src)}" target="_blank" rel="noopener">fonte</a>`:''}</li>`).join('')}</ul>`:'<p class="note">Nada ainda.</p>'}</div>`;

function renderBuild(){

 <p class="note">Os slimes trabalham, constroem e plantam árvores sozinhos. Construções nunca ocupam árvores, riachos ou a margem deles, e o mundo cresce quando falta espaço.</p>

for(const t of['chat','slime','build','log'])$('#t-'+t).onclick=()=>{curTab=t;document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.id==='t-'+t));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+t));renderAll()};

function openIssue(title,text,tipo){
 const s=sel();
 if(!OWNER){toast('As mensagens funcionam quando o mundo está publicado no GitHub Pages.');return}
 const body=`${text}\n\n(não apague as linhas abaixo, elas dizem ao mundo para qual slime é a mensagem)\n<!-- mundo-slimes -->\n<!-- slime:${s.id} -->\n<!-- tipo:${tipo} -->`;
 window.open(`https://github.com/${OWNER}/${REPO}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`,'_blank','noopener');
 toast(`Abrimos o GitHub numa nova aba. Confirme lá, e ${s.name} responde aqui em cerca de 1 minuto.`);

}
/* ---------- conversa instantânea (Firebase) ---------- */
const FB={on:false,db:null,uid:null,f:null,live:[],local:[],
 pending(id){const lim=S&&S.fbLast?Date.parse(S.fbLast):0;const out=[];
  for(const m of this.live)if(m.slime===id&&m.at>lim)out.push({r:'u',a:m.autor,t:m.texto,p:1,at:m.at});
  for(const m of this.local)if(m.slime===id&&m.at>lim)out.push({r:'s',t:m.t,g:m.g,p:1,at:m.at+1});
  return out.sort((a,b)=>a.at-b.at)}};
async function initFirebase(){
 let cfg=null;try{const r=await fetch('firebase-config.json',{cache:'no-store'});if(r.ok)cfg=await r.json()}catch(e){}
 if(!cfg||!cfg.apiKey||!cfg.projectId){$('#how').textContent+=' As mensagens são enviadas pelo GitHub: ao clicar em Enviar abre uma aba do GitHub, é só confirmar. O slime responde aqui em cerca de 1 minuto.';return}
 try{
  const V='10.14.1',base=`https://www.gstatic.com/firebasejs/${V}/`;
  const [{initializeApp},{getAuth,signInAnonymously},f]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  const app=initializeApp(cfg);const cred=await signInAnonymously(getAuth(app));
  FB.uid=cred.user.uid;FB.db=f.getFirestore(app);FB.f=f;FB.on=true;
  f.onSnapshot(f.query(f.collection(FB.db,'mensagens'),f.orderBy('at','desc'),f.limit(60)),snap=>{
   FB.live=snap.docs.map(d=>{const x=d.data({serverTimestamps:'estimate'});return{slime:x.slime,autor:x.autor,texto:x.texto,at:x.at?x.at.toMillis():Date.now()}});
   if(S)renderChat();
  },()=>{});
  $('#how').textContent+=' Converse à vontade: o slime responde na hora, e o que ele aprende entra no mundo em poucos minutos.';
 }catch(e){FB.on=false;$('#how').textContent+=' As mensagens são enviadas pelo GitHub: ao clicar em Enviar abre uma aba do GitHub, é só confirmar.'}
}
const nickEl=$('#nick');try{nickEl.value=localStorage.getItem('slimes-nick')||''}catch(e){}
nickEl.onchange=()=>{try{localStorage.setItem('slimes-nick',nickEl.value.trim())}catch(e){}};
async function sendFB(text,tipo){
 const s=sel(),f=FB.f,autor=(nickEl.value.trim()||'Visitante').replace(/[<>@]/g,'').slice(0,24);
 const b=f.writeBatch(FB.db);
 b.set(f.doc(FB.db,'usuarios',FB.uid),{last:f.serverTimestamp()});
 b.set(f.doc(f.collection(FB.db,'mensagens')),{slime:s.id,texto:text.slice(0,400),tipo,autor,uid:FB.uid,at:f.serverTimestamp()});
 try{await b.commit()}catch(e){toast(String(e&&e.code).includes('permission')?'Calma! Espere uns segundinhos antes de mandar outra mensagem.':'Não consegui enviar agora. Tente de novo.');return false}
 const now=Date.now();
 if(tipo==='pesquisa'){FB.local.push({slime:s.id,t:`Que legal! Vou pesquisar sobre “${text.slice(0,80)}” já já e conto o que descobri.`,at:now});}
 else{const clone=JSON.parse(JSON.stringify(S)),E2=Mu.Engine(clone),c=clone.slimes.find(x=>x.id===s.id);const r=E2.talk(c,autor,text);FB.local.push({slime:s.id,t:r.reply,g:r.gain>0?`+${fmt(r.gain)} de conhecimento, entra no mundo em poucos minutos`:'',at:now});V[s.id].say={t:r.reply,until:performance.now()+5000}}
 renderChat();fast=Date.now()+10*60e3;schedule();return true;
}

initFirebase();
setInterval(()=>{if(S)renderStats()},30000);
{const mob=matchMedia('(max-width:900px)'),rrow=$('#topic').parentElement,mo=$('#moreopt');
 const apply=()=>{mo.style.display=mob.matches?'':'none';rrow.style.display=mob.matches&&mo.getAttribute('aria-expanded')!=='true'?'none':''};
 mo.onclick=()=>{mo.setAttribute('aria-expanded',mo.getAttribute('aria-expanded')==='true'?'false':'true');apply()};

  el.addEventListener('focus',()=>{if(mob.matches){document.body.classList.remove('mapbig');document.body.classList.add('typing');setTimeout(()=>{resize();const c=$('#chat');c.scrollTop=c.scrollHeight;el.scrollIntoView({block:'nearest'})},320)}});
  el.addEventListener('blur',()=>{setTimeout(()=>{if(!document.activeElement||!['msg','topic','nick'].includes(document.activeElement.id)){document.body.classList.remove('typing');setTimeout(resize,300)}},150)});
 }
 if(window.visualViewport)visualViewport.addEventListener('resize',()=>setTimeout(resize,50));
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
requestAnimationFrame(frame);
load().then(schedule);
}
