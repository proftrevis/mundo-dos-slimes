name: Mundo dos Slimes

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  issues:
    types: [opened]

concurrency:
  group: mundo
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  mundo:
    # Só responde issues criadas pela página do jogo.
    if: github.event_name != 'issues' || contains(github.event.issue.body, '<!-- mundo-slimes -->')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: dados
          path: dados
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rodar o mundo
        env:
          MODE: ${{ github.event_name == 'issues' && 'message' || 'tick' }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node sim/run.js dados/world.json
      - name: Salvar o mundo
        working-directory: dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world.json
          # Mantém só uma versão do mundo no ramo de dados, para o repositório não crescer sem parar.
          git commit --amend -m "Estado atual do mundo" || exit 0
          git push --force origin HEAD:dados
      - name: Responder ao visitante
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file reply.md
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"
